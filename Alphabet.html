<!-- FILENAME: alphabet.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alphabet - Ghiotto Studios</title>
<link rel="icon" href="Fav.png" type="image/png" />

<style>
  @font-face { font-family: 'Capuche'; src: url('Capuche.otf') format('opentype'); font-weight: normal; font-style: normal; }
  @font-face { font-family: 'GaramondCustom'; src: url('Garamond.ttf') format('truetype'); font-weight: normal; font-style: normal; }

  :root { --main-blue: #003380; }

  body {
    margin: 0; font-family: 'GaramondCustom', serif; font-size: 1.1rem; overflow-x: hidden;
    color: var(--main-blue);
    background: url('sfondo2.webp') no-repeat center center fixed; 
    background-size: cover;
    opacity: 0; transition: opacity 0.6s ease-in-out;
  }
  body.fade-out { opacity: 0; }

  /* CSS CONDIVISO */
  .float-shape { position: fixed; z-index: 1; pointer-events: none; border: 1px solid rgba(255,255,255,0.4); opacity: 0.85; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-shadow: inset 0 0 20px rgba(255,255,255,0.5), 0 10px 20px rgba(0,0,0,0.2); transition: transform 0.12s linear; will-change: transform; }
  #shape1 { width: 220px; height: 180px; background: rgba(255, 46, 46, 0.7); top: 8%; left: 4%; border-radius: 55% 40% 70% 45% / 60% 75% 35% 55%; }
  #shape2 { width: 240px; height: 200px; background: rgba(43, 99, 255, 0.7); top: 36%; right: 6%; border-radius: 60% 70% 50% 65% / 70% 40% 65% 55%; }
  #shape3 { width: 200px; height: 190px; background: rgba(255, 226, 59, 0.7); bottom: 12%; left: 16%; border-radius: 75% 40% 60% 35% / 50% 70% 45% 65%; }
  #shape4 { width: 180px; height: 150px; background: rgba(255, 127, 0, 0.7); top: 24%; left: 46%; border-radius: 65% 55% 70% 40% / 55% 60% 50% 65%; }
  #shape5 { width: 210px; height: 160px; background: rgba(0, 255, 166, 0.7); bottom: 18%; right: 12%; border-radius: 55% 70% 35% 60% / 60% 40% 70% 55%; }
  #shape6 { width: 140px; height: 140px; background: rgba(255, 102, 179, 0.7); top: 10%; right: 28%; border-radius: 50% 65% 60% 40% / 55% 45% 65% 50%; }

  /* HEADER */
  header { width: 100%; height: 80px; background: rgba(255,255,255,0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: fixed; top: 0; z-index: 100; box-sizing: border-box; }
  .logo-area { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; }
  .custom-logo { height: 35px; width: auto; object-fit: contain; }
  .studio-title { font-size: 1.8rem; font-family: 'Capuche', serif; white-space: nowrap; color: var(--main-blue); line-height: 1; margin-top: 5px; }
  .desktop-nav a { margin-left: 1.5rem; text-decoration: none; font-family: 'Capuche', serif; font-weight: normal; font-size: 1.5rem; color: var(--main-blue); transition: color 0.18s ease; cursor: pointer; }
  .desktop-nav a:hover, .desktop-nav a.active { color:#ff4da6; }
  .mobile-menu-trigger { display: none; }
  .mobile-drawer-overlay { display: none; }

  .page-header { margin-top: 100px; margin-bottom: 2rem; text-align: center; position: relative; z-index: 10; }
  .page-header h1 { font-family: 'Capuche', serif; font-size: clamp(3rem, 8vw, 6rem); color: var(--main-blue); margin: 0; display: inline-block; padding: 1rem 3rem; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); }

  /* --- GRID ALFABETO --- */
  .alphabet-container { max-width: 1300px; margin: 0 auto; padding: 2rem; position: relative; z-index: 10; }
  
  .alphabet-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 2.5rem; 
  }

  .letter-card { 
    background: rgba(255, 255, 255, 0.5); 
    border: 1px solid rgba(255, 255, 255, 0.6); 
    border-radius: 20px; 
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
    overflow: hidden; 
    display: flex; flex-direction: column; 
    cursor: pointer;
    aspect-ratio: 3/4; 
    opacity: 1;
    transition: opacity 0.3s;
  }
  .letter-card:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.7); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
  
  .letter-image-container { 
    width: 100%; aspect-ratio: 3/4; overflow: hidden; 
    border-bottom: 1px solid rgba(255,255,255,0.3); position: relative; 
  }
  
  .letter-image-container img { 
    width: 100%; 
    height: 100%; 
    object-fit: contain; 
    padding: 1.5rem; 
    box-sizing: border-box;
    transition: transform 0.5s ease;
  }
  
  .letter-card:hover .letter-image-container img { transform: scale(1.1); } 

  .letter-title { padding: 1rem; text-align: center; }
  .letter-title h3 { margin: 0; font-family: 'Capuche', serif; font-size: 2.5rem; color: var(--main-blue); }

  /* --- MODAL (FINESTRA ESPANSA) --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0); z-index: 1000;
    display: none; justify-content: center; align-items: center;
    transition: background 0.4s ease;
  }
  .modal-overlay.active { display: flex; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); }

  .modal-card {
    background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    width: 90vw; max-width: 1000px; height: 85vh;
    transform-origin: top left; will-change: transform, width, height, opacity;
    position: relative;
  }

  .modal-image-wrapper {
    width: 100%; flex-grow: 1; overflow: hidden;
    position: relative; display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  
  #modalImg { width: 100%; height: 100%; object-fit: contain; display: block; padding: 1rem; box-sizing: border-box; }

  /* Carosello Modale */
  .carousel-view { width: 100%; height: 100%; overflow: hidden; position: absolute; inset: 0; display: none; }
  .carousel-view.active { display: block; }
  .modal-carousel-track { display: flex; height: 100%; width: 100%; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
  .modal-slide { min-width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; box-sizing: border-box; padding: 1rem; }
  .modal-slide img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }
  
  .modal-nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.7); border: 1px solid #fff;
    width: 50px; height: 50px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; z-index: 20; color: var(--main-blue); font-size: 1.5rem;
    transition: transform 0.2s;
  }
  .modal-nav-btn:hover { transform: translateY(-50%) scale(1.1); background: #fff; }
  .modal-nav-btn.prev { left: 20px; }
  .modal-nav-btn.next { right: 20px; }

  .modal-content { padding: 1rem; text-align: center; background: rgba(255,255,255,0.4); }
  .modal-title-text { font-family: 'Capuche', serif; font-size: 3rem; color: var(--main-blue); margin: 0; }
  .close-modal { position: absolute; top: 1rem; right: 1.5rem; font-size: 3rem; cursor: pointer; font-family: sans-serif; color: var(--main-blue); z-index: 30; line-height: 0.5; transition: transform 0.2s; }
  .close-modal:hover { transform: scale(1.1); }

  footer { padding: 3rem; text-align:center; position: relative; z-index: 10; color: var(--main-blue); background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); font-family: 'GaramondCustom', serif; font-weight: bold; margin-top: 3rem; }

  /* --- MOBILE --- */
  @media (max-width: 768px) {
    body { background-attachment: scroll !important; }
    header { padding: 0 1.5rem; justify-content: center; }
    .desktop-nav { display: none; }
    .studio-title { display: none; }
    .logo-area { position: absolute; left: 50%; transform: translateX(-50%); }
    .custom-logo { height: 30px; }
    .mobile-menu-trigger { display: block; position: absolute; right: 1.5rem; font-family: 'Capuche', serif; font-size: 1.5rem; color: var(--main-blue); cursor: pointer; z-index: 201; }
    .mobile-drawer-overlay { display: block; position: fixed; top: 0; right: -100%; width: 85%; height: 100vh; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 200; transition: right 0.4s; padding: 6rem 2rem; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
    .mobile-drawer-overlay.open { right: 0; }
    .close-menu-btn { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 3rem; cursor: pointer; }
    .drawer-links { display: flex; flex-direction: column; gap: 2rem; align-items: center; }
    .drawer-links a { font-family: 'Capuche', serif; font-size: 2.5rem; color: var(--main-blue); text-decoration: none; }
    .drawer-footer { text-align: center; font-family: 'Capuche', serif; font-size: 1.2rem; opacity: 0.8; border-top: 1px solid rgba(0,51,128,0.2); padding-top: 1.5rem; }
    
    /* MODIFICA MOBILE: 1 Colonna sola e card più grandi */
    .alphabet-grid { 
      grid-template-columns: 1fr; /* Una sola colonna */
      gap: 2rem; /* Più spazio */
      padding: 0 1.5rem; 
    }
    
    .modal-card { width: 95vw; height: 80vh; }
    .nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div id="shape1" class="float-shape"></div>
<div id="shape2" class="float-shape"></div>
<div id="shape3" class="float-shape"></div>
<div id="shape4" class="float-shape"></div>
<div id="shape5" class="float-shape"></div>
<div id="shape6" class="float-shape"></div>

<header>
  <div class="logo-area" onclick="transitionToPage('portfolio_website.html')">
    <img src="logo.png" alt="Ghiotto Studios Logo" class="custom-logo">
    <div class="studio-title">Ghiotto Studios</div>
  </div>
  <nav class="desktop-nav">
    <a href="#" onclick="transitionToPage('about.html')">About</a>
    <a href="#" onclick="transitionToPage('projects.html')" class="active">Projects</a>
    <a href="#" onclick="transitionToPage('contacts.html')">Contacts</a>
  </nav>
  <div class="mobile-menu-trigger" onclick="toggleMobileMenu()">Menu</div>
</header>

<div id="mobileDrawer" class="mobile-drawer-overlay">
  <div class="close-menu-btn" onclick="toggleMobileMenu()">&times;</div>
  <div class="drawer-links">
    <a href="#" onclick="transitionToPage('about.html')">About</a>
    <a href="#" onclick="transitionToPage('projects.html')" style="color:#ff4da6;">Projects</a>
    <a href="#" onclick="transitionToPage('contacts.html')">Contacts</a>
  </div>
  <div class="drawer-footer">Ghiotto Studios</div>
</div>

<section class="page-header">
  <h1>Alphabet</h1>
</section>

<!-- GRIGLIA ALFABETO -->
<div class="alphabet-container">
  <div class="alphabet-grid" id="alphabetGrid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="close-modal" onclick="closeModalAnimation()">&times;</div>
    
    <div class="modal-image-wrapper">
      <img src="" alt="" id="modalImg" style="display:none;">
      
      <div id="carouselView" class="carousel-view">
        <div id="modalCarouselTrack" class="modal-carousel-track"></div>
      </div>
      
      <button id="prevBtn" class="modal-nav-btn prev" onclick="changeModalSlide(-1)">&#10094;</button>
      <button id="nextBtn" class="modal-nav-btn next" onclick="changeModalSlide(1)">&#10095;</button>
    </div>

    <div class="modal-content">
      <h3 class="modal-title-text" id="modalTitle">A</h3>
    </div>
  </div>
</div>

<footer>© 2025 Ghiotto Studios — All rights reserved</footer>

<script>
// --- CONFIGURAZIONE LETTERE SPECIALI ---
const specialLetters = {
    'A': { cover: 'A2.webp', slides: ['A2.webp', 'A.webp'] },
    'F': { cover: 'F.webp',  slides: ['F.webp', 'F2.webp'] },
    'V': { cover: 'V.webp',  slides: ['V.webp', 'V3.webp', 'V4.webp'] }
};

// --- DOM ELEMENTS ---
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const gridContainer = document.getElementById('alphabetGrid');
const modalOverlay = document.getElementById('modalOverlay');
const modalCard = document.getElementById('modalCard');
const modalImg = document.getElementById('modalImg');
const carouselView = document.getElementById('carouselView');
const modalCarouselTrack = document.getElementById('modalCarouselTrack');
const modalTitle = document.getElementById('modalTitle');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentTriggerCard = null;
let currentSlideIndex = 0;
let currentSlides = [];

// --- GENERAZIONE GRIGLIA ---
alphabet.forEach(letter => {
    let coverImg = `${letter}.webp`;
    let isSpecial = false;

    if (specialLetters[letter]) {
        coverImg = specialLetters[letter].cover;
        isSpecial = true;
    }

    const card = document.createElement('article');
    card.className = 'letter-card';
    card.onclick = function() { openModalAnimation(this, letter, isSpecial); };

    card.innerHTML = `
      <div class="letter-image-container">
        <img src="${coverImg}" alt="Letter ${letter}" onerror="this.style.display='none'">
      </div>
      <div class="letter-title">
        <h3>${letter}</h3>
      </div>
    `;
    gridContainer.appendChild(card);
});

// --- APERTURA MODALE (Shared Element Transition) ---
function openModalAnimation(cardElement, letter, isSpecial) {
    currentTriggerCard = cardElement;
    modalTitle.textContent = letter;

    // Reset view
    modalImg.style.display = 'none';
    carouselView.classList.remove('active');
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    
    modalCarouselTrack.style.transform = `translateX(0)`;
    modalCarouselTrack.innerHTML = ''; 

    if (isSpecial) {
        // CAROSELLO
        currentSlides = specialLetters[letter].slides;
        currentSlideIndex = 0;
        
        currentSlides.forEach((src) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'modal-slide';
            const img = document.createElement('img');
            img.src = src;
            slideDiv.appendChild(img);
            modalCarouselTrack.appendChild(slideDiv);
        });

        carouselView.classList.add('active');
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
    } else {
        // IMMAGINE SINGOLA
        modalImg.src = `${letter}.webp`;
        modalImg.style.display = 'block';
    }

    // Animazione Espansione
    const startRect = cardElement.getBoundingClientRect();
    modalOverlay.style.display = 'flex';
    void modalOverlay.offsetWidth; 
    const endRect = modalCard.getBoundingClientRect();

    const translateX = startRect.left - endRect.left;
    const translateY = startRect.top - endRect.top;
    const scaleX = startRect.width / endRect.width;
    const scaleY = startRect.height / endRect.height;

    modalCard.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
    modalCard.style.opacity = '0.7';
    modalCard.style.transition = 'none';

    requestAnimationFrame(() => {
        cardElement.style.opacity = '0';
        requestAnimationFrame(() => {
            modalCard.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s';
            modalCard.style.transform = 'translate(0, 0) scale(1)';
            modalCard.style.opacity = '1';
            modalOverlay.classList.add('active');
        });
    });
}

// --- LOGICA SCORRIMENTO CAROSELLO ---
function changeModalSlide(direction) {
    currentSlideIndex += direction;
    const total = currentSlides.length;

    if (currentSlideIndex < 0) currentSlideIndex = total - 1;
    if (currentSlideIndex >= total) currentSlideIndex = 0;

    const offset = -(currentSlideIndex * 100);
    modalCarouselTrack.style.transform = `translateX(${offset}%)`;
}

// --- CHIUSURA MODALE ---
function closeModalAnimation() {
    if (!currentTriggerCard) return;

    const startRect = currentTriggerCard.getBoundingClientRect();
    const endRect = modalCard.getBoundingClientRect();
    const translateX = startRect.left - endRect.left;
    const translateY = startRect.top - endRect.top;
    const scaleX = startRect.width / endRect.width;
    const scaleY = startRect.height / endRect.height;

    modalCard.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s';
    modalCard.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scaleX}, ${scaleY})`;
    modalCard.style.opacity = '0';
    modalOverlay.classList.remove('active');

    modalCard.addEventListener('transitionend', function handler() {
        modalOverlay.style.display = 'none';
        modalCard.style.transform = '';
        modalCard.style.opacity = '';
        modalCard.style.transition = '';
        currentTriggerCard.style.opacity = '1';
        currentTriggerCard = null;
        modalCard.removeEventListener('transitionend', handler);
    }, { once: true });
}

modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModalAnimation();
});

// --- BASE SITE JS ---
window.addEventListener('load', function() { document.body.style.opacity = '1'; });
function transitionToPage(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 500); }
function toggleMobileMenu() { const drawer = document.getElementById('mobileDrawer'); drawer.classList.toggle('open'); }
const shapes = Array.from(document.querySelectorAll('.float-shape')); const params = shapes.map((_, i)=>({mxFactor:0.03+i*0.015, scrollFactor:0.08+i*0.03, wobbleSpeed:0.8+i*0.25, wobbleAmp:6+i*4, rotateAmp:3+i*2.5})); let mouseX=window.innerWidth/2, mouseY=window.innerHeight/2, scrollY=window.scrollY||0; document.addEventListener('mousemove', e=>{mouseX=e.clientX; mouseY=e.clientY}); window.addEventListener('scroll', ()=>{scrollY=window.scrollY}); function animate(time){ shapes.forEach((s,i)=>{ const p=params[i]; const mx=(window.innerWidth/2-mouseX)*p.mxFactor; const my=(window.innerHeight/2-mouseY)*p.mxFactor; const sy=scrollY*p.scrollFactor; const wobbleX=Math.sin(time*0.001*p.wobbleSpeed+i)*p.wobbleAmp; const wobbleY=Math.cos(time*0.001*p.wobbleSpeed+i*1.3)*p.wobbleAmp*0.6; const rotate=Math.sin(time*0.0006*p.wobbleSpeed+i)*p.rotateAmp; const tx=mx+wobbleX; const ty=sy+my+wobbleY; s.style.transform=`translate(${tx}px, ${ty}px) rotate(${rotate}deg)`; }); requestAnimationFrame(animate); } requestAnimationFrame(animate);
</script>
</body>
</html>
